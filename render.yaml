# Render Blueprint for FinCore (Sections 1-8)
# Free plans only. Set no secrets here; the database connection is injected
# from the managed PostgreSQL instance via fromDatabase.
services:
  - type: web
    name: fincore-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fincore-db
          property: connectionString

  - type: web
    name: fincore-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: fincore-backend
          property: host

  - type: web
    name: fincore-analytics
    runtime: python
    plan: free
    rootDir: analytics
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

databases:
  - name: fincore-db
    plan: free